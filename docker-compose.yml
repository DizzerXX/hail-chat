services:
  postgres:
    image: postgres:16-alpine
    container_name: tdechat-postgres
    environment:
      POSTGRES_DB: tdechat
      POSTGRES_USER: tdechat
      POSTGRES_PASSWORD: tdechat
    ports:
      # 5433 on the host: another project's Postgres owns 5432 on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdechat -d tdechat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tdechat-redis
    ports:
      # 6380 on the host: another project's Redis owns 6379 on this machine.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
