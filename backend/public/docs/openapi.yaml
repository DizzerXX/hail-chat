openapi: 3.1.0

info:
  title: TDEChat API
  version: 1.0.0
  description: |
    REST API for TDEChat — Telediant's standalone-first livechat & chatbot platform.

    ## Areas
    - **Public** — unauthenticated widget API. The conversation `uuid` is an unguessable
      capability: whoever holds it may read/write that conversation.
    - **Auth** — Sanctum bearer-token authentication for agents/supervisors/admins.
    - **Agent** — the agent inbox (list, accept, reply, close, reroute). Requires a bearer
      token plus the RBAC permission listed per endpoint.

    ## Realtime (websockets)
    Events are broadcast over Laravel Reverb (Pusher protocol, `ws://HOST:8080` in dev).

    | Channel | Type | Events |
    |---------|------|--------|
    | `conversation.{uuid}` | public | `conversation.updated`, `message.sent`, `message.translated`, `agent.typing` |
    | `private-inbox.{inboxId}` | private | `conversation.created`, `conversation.updated`, `message.sent`, `message.translated` |
    | `private-agents.{agentId}` | private | `conversation.updated` (when assigned), `agent.notified` (idle prompts) |

    Private channels authenticate via `POST /api/broadcasting/auth` (bearer token).

    ## Outbound webhooks
    See the **Webhooks** section at the bottom of this document. Every delivery is signed:
    `X-TDEChat-Signature: sha256=HMAC_SHA256(raw_body, webhook_secret)`.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Public
    description: Unauthenticated widget endpoints
  - name: Auth
    description: Token authentication
  - name: Agent
    description: Agent inbox (bearer token + permission)
  - name: Admin
    description: Management API (bearer token + per-area permission)

paths:
  /api/v1/public/inboxes/{inboxSlug}/conversations:
    post:
      tags: [Public]
      summary: Start a conversation
      description: |
        Creates a conversation with the first visitor message. When the inbox has the
        FAQ bot enabled the reply (if any) is included in `data.messages`; on a bot miss
        the conversation escalates to the agent queue (configurable per inbox via
        `channel_config.bot.escalate_on_miss`). Rate limit: 10/min per IP.
      operationId: startConversation
      parameters:
        - $ref: '#/components/parameters/InboxSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000 }
                visitor_name: { type: [string, 'null'], maxLength: 255 }
                visitor_email: { type: [string, 'null'], format: email, maxLength: 255 }
                visitor_phone: { type: [string, 'null'], maxLength: 50 }
                language: { type: [string, 'null'], enum: [ms, en, null], description: Defaults to ms }
                meta: { type: [object, 'null'], description: 'Free-form context (page URL, referrer, …)' }
      responses:
        '201':
          description: Conversation created (messages included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: Upstream contact-center (MiCC) error while creating the work item — retry the escalation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/public/inboxes/{inboxSlug}/faqs:
    get:
      tags: [Public]
      summary: Browse public FAQs
      description: Active FAQ entries in the requested language (default `ms`, unknown values fall back to the default).
      operationId: listPublicFaqs
      parameters:
        - $ref: '#/components/parameters/InboxSlug'
        - name: language
          in: query
          required: false
          schema: { type: string, enum: [ms, en] }
      responses:
        '200':
          description: FAQ list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Faq' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/app-config:
    get:
      tags: [Public]
      summary: Widget theme config
      description: Unauthenticated. Minimal theme values the embeddable widget reads on load.
      operationId: publicAppConfig
      responses:
        '200':
          description: Theme
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bubble_color: { type: string, example: '#2f80ed' }
                      faq:
                        type: object
                        description: FAQ-deflection opening screen. When `enabled` and the inbox has FAQs for the widget's default language, the widget opens on a "Quick answers" screen before the pre-chat form so visitors can self-serve first. The `title`/`prompt`/`button` are bilingual maps that switch with the screen's language tabs.
                        properties:
                          enabled: { type: boolean, example: true }
                          title: { $ref: '#/components/schemas/BilingualText' }
                          prompt: { $ref: '#/components/schemas/BilingualText' }
                          button: { $ref: '#/components/schemas/BilingualText' }

  /api/v1/public/conversations/{conversationUuid}:
    get:
      tags: [Public]
      summary: Fetch a conversation with its messages
      description: Polling fallback for clients without a websocket connection.
      operationId: showPublicConversation
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/conversations/{conversationUuid}/messages:
    post:
      tags: [Public]
      summary: Send a visitor message
      description: While the conversation is in `bot` status the FAQ bot may answer; the reply is returned as `bot_reply` and also broadcast.
      operationId: sendVisitorMessage
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      requestBody:
        $ref: '#/components/requestBodies/MessageBody'
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
                  bot_reply:
                    oneOf:
                      - $ref: '#/components/schemas/Message'
                      - type: 'null'
                  status: { $ref: '#/components/schemas/ConversationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/public/conversations/{conversationUuid}/escalate:
    post:
      tags: [Public]
      summary: Ask for a human agent
      description: Moves a `pending`/`bot` conversation into the agent queue and fires the `conversation.escalated` webhook.
      operationId: escalateConversation
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Escalated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/system-settings:
    get:
      tags: [Admin]
      summary: Read system settings (branding + data retention)
      description: Requires `system.manage`. The public `brand` (app_name/favicon/logo) is also exposed unauthenticated via `/public/app-config`.
      operationId: getSystemSettings
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Update system settings
      description: >
        Requires `system.manage`. `retention_days` is floored at
        `system.retention_min_days`. Enabling retention schedules permanent daily
        deletion of closed/abandoned conversations older than the window.
      operationId: updateSystemSettings
      responses:
        '200': { description: Saved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/system/status:
    get:
      tags: [Admin]
      summary: System health snapshot
      description: "Requires `system.manage`. Best-effort checks: database, redis, reverb, queue, mitel, license seats."
      operationId: getSystemStatus
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/conversations/{conversationUuid}:
    delete:
      tags: [Admin]
      summary: Move a conversation to the recycle bin
      description: Requires `conversations.delete`. Soft-deletes (restorable); auto-purged after `recycle_bin_days` (30). Audited.
      operationId: deleteConversation
      responses:
        '204': { description: Moved to bin }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/conversations/trashed:
    get:
      tags: [Admin]
      summary: List the recycle bin
      description: Requires `conversations.delete`. Soft-deleted conversations, newest first; `deleted_by` is the admin's name or "Retention".
      operationId: trashedConversations
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/conversations/{conversationUuid}/restore:
    post:
      tags: [Admin]
      summary: Restore a conversation from the recycle bin
      operationId: restoreConversation
      responses:
        '204': { description: Restored }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/conversations/{conversationUuid}/force:
    delete:
      tags: [Admin]
      summary: Permanently delete a conversation from the bin
      description: Requires `conversations.delete`. Irreversible — removes rows + attachment files. Audited.
      operationId: purgeConversation
      responses:
        '204': { description: Permanently deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{userId}/activity:
    get:
      tags: [Admin]
      summary: A user's account/system audit trail
      description: Requires `agents.manage`. Login, settings, and user-management actions performed by that user (for the users-list "View" dialog).
      operationId: getUserActivity
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/public/conversations/{conversationUuid}/close:
    post:
      tags: [Public]
      summary: Close the conversation (visitor side)
      operationId: closeConversationAsVisitor
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/public/conversations/{conversationUuid}/leave:
    post:
      tags: [Public]
      summary: Signal the visitor left the page
      description: >
        Sent by the widget as a `navigator.sendBeacon` on `pagehide`. Starts a
        grace countdown (`chat.visitor_left_grace_seconds`, default 30s); the
        idle sweep then abandons the chat as `visitor_left` unless `/present`
        clears it first. No request body, so the beacon needs no CORS preflight.
        A no-op on closed or Mitel conversations.
      operationId: markVisitorLeft
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/conversations/{conversationUuid}/present:
    post:
      tags: [Public]
      summary: Signal the visitor is present
      description: >
        Cancels a pending `/leave` when the widget reconnects (page reload,
        bfcache restore, or socket reconnect). A no-op when nothing is pending.
      operationId: markVisitorPresent
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '204': { description: Cleared }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a bearer token
      description: Re-issuing for the same `device_name` revokes the previous token. Rate limit 10/min per IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, examples: ['1|X9y…'] }
                  user: { $ref: '#/components/schemas/User' }
        '403':
          description: Account deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile, role and permissions
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/agent/conversations:
    get:
      tags: [Agent]
      summary: List conversations
      description: |
        Permission `conversations.view_own`. Scopes —
        `mine`: assigned to my agent profile; `queue`: awaiting acceptance and visible to me
        (offered to me, my teams, or the general queue); `all`: everything (additionally
        requires `conversations.view_all`). Paginated, 25 per page, newest activity first.
      operationId: listAgentConversations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, queue, all], default: mine }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ConversationStatus' }
        - name: inbox_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/agent/conversations/{conversationUuid}:
    get:
      tags: [Agent]
      summary: Conversation detail with messages
      description: Permission `conversations.view_own`; visibility limited to own/queue conversations unless `conversations.view_all`.
      operationId: showAgentConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent/conversations/{conversationUuid}/accept:
    post:
      tags: [Agent]
      summary: Accept a queued conversation
      description: Permission `conversations.accept`. Team-targeted conversations require membership; agent-targeted ones must match, unless the caller holds `conversations.assign`.
      operationId: acceptConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Accepted — status becomes `active`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/agent/conversations/{conversationUuid}/claim:
    post:
      tags: [Agent]
      summary: Take ownership of an unowned conversation
      description: >-
        Permission `conversations.accept`. Used by the embedded chat window
        (`/embed/chat/{uuid}`, the MiCC work-item TargetUri): once an agent accepts
        the item in Ignite, MiCC ACDs it and the poller marks the conversation
        `active` while leaving it unassigned, because MiCC never reports which of
        its agents took it. Claiming attaches the caller so they can reply.
        A queued conversation is accepted outright; one the caller already owns
        returns unchanged (safe to call on every load). Conflicts when the
        conversation is closed, or held by another agent and the caller lacks
        `conversations.assign`.
      operationId: claimConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Claimed — the caller is now the assigned agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/agent/conversations/{conversationUuid}/close:
    post:
      tags: [Agent]
      summary: Close a conversation
      description: Permission `conversations.close`; assignee only unless `conversations.assign`. Fires the `conversation.closed` webhook.
      operationId: closeConversationAsAgent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/agent/conversations/{conversationUuid}/messages:
    post:
      tags: [Agent]
      summary: Send an agent message
      description: Permission `messages.send`; conversation must be `active` and assigned to the caller (or caller holds `conversations.assign`).
      operationId: sendAgentMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      requestBody:
        $ref: '#/components/requestBodies/MessageBody'
      responses:
        '201':
          description: Message stored and broadcast
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/agent/conversations/{conversationUuid}/reroute:
    post:
      tags: [Agent]
      summary: Reroute to a team or an agent
      description: Permission `conversations.assign`. Exactly one of `team_id` / `agent_id`. Conversation returns to `awaiting_acceptance`.
      operationId: rerouteConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id: { type: integer }
                agent_id: { type: integer }
      responses:
        '200':
          description: Rerouted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/agent/conversations/{conversationUuid}/typing:
    post:
      tags: [Agent]
      summary: Broadcast a typing indicator
      description: Permission `messages.send`. Ephemeral — broadcast as `agent.typing`, never persisted.
      operationId: agentTyping
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                typing: { type: boolean, default: true }
      responses:
        '204': { description: Broadcast sent }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/agent/inboxes:
    get:
      tags: [Agent]
      summary: Active inboxes (for realtime channel subscriptions and filters)
      description: Permission `conversations.view_own`.
      operationId: listAgentInboxes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active inboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        channel_type: { type: string, enum: [standalone, mitel_openmedia] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/agent/status:
    put:
      tags: [Agent]
      summary: Update my availability
      operationId: updateAgentStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AgentStatus' }
      responses:
        '200':
          description: Updated agent profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/agent/app-config:
    get:
      tags: [Agent]
      summary: Feature flags for the dashboard (translation mode, languages)
      operationId: agentAppConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      translation:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          method: { type: [string, 'null'], enum: [manual, auto, null] }
                      languages:
                        type: array
                        items: { type: string }

  /api/v1/agent/translate:
    post:
      tags: [Agent]
      summary: Translate a composer draft (nothing stored)
      description: Permission `messages.send`. 404 when translation is disabled; 503 when the AI endpoint is not configured; 502 on AI failure.
      operationId: translateDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target]
              properties:
                text: { type: string, maxLength: 4000 }
                target: { type: string, enum: [ms, en] }
      responses:
        '200':
          description: Translation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      translation: { type: string }
                      target: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Translation server failure }
        '503': { description: Translation server not configured }

  /api/v1/agent/conversations/{conversationUuid}/messages/{id}/translate:
    post:
      tags: [Agent]
      summary: Translate a stored message (cached on the message, broadcast as message.translated)
      description: Permission `messages.send`; message must belong to the conversation. Default target follows the pair rule (visitor→counterpart, agent→conversation language).
      operationId: translateMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationUuid'
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, enum: [ms, en] }
      responses:
        '200':
          description: Message with meta.translations populated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Translation server failure }
        '503': { description: Translation server not configured }

  /api/v1/admin/license:
    get:
      tags: [Admin]
      summary: License status for the admin screen
      description: >-
        Permission `license.manage`. Returns the synced license pool and how much of it is
        spent — one license activates one agent. `configured=false` means the platform env is
        unset and the installation runs unrestricted.
      operationId: adminLicense
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: License pool, seat usage and per-license assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LicenseInfo' }

  /api/v1/admin/license/seats:
    get:
      tags: [Admin]
      summary: Seat usage for the user-management screen
      description: Permission `agents.manage`. Reachable even while the license gate blocks user management.
      operationId: adminLicenseSeats
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Seats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enforced: { type: boolean }
                      used: { type: integer }
                      max: { type: [integer, 'null'] }

  /api/v1/admin/license/sync:
    post:
      tags: [Admin]
      summary: Sync the license pool from the platform
      description: >-
        Permission `license.manage`. Calls `admin/platforms/sync-licenses` (which activates
        them on the platform) then `admin/platforms/licenses` for the detail the sync response
        omits, upserts the pool locally, and hands free licenses to any active agent without
        one, oldest first. Idempotent.
      operationId: adminLicenseSync
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Refreshed license pool — same shape as GET /admin/license
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LicenseInfo' }
        '422': { description: The license platform is not configured }
        '502': { description: License platform rejected the request or is unreachable }

  /api/v1/admin/licenses/{licenseId}/release:
    post:
      tags: [Admin]
      summary: Return a license to the pool
      description: >-
        Permission `license.manage`. Unbinds the license from its agent so another agent can
        take it. Deactivating a user does **not** do this — the binding is deliberately kept.
      operationId: adminLicenseRelease
      security: [{ bearerAuth: [] }]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Refreshed license pool — same shape as GET /admin/license
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LicenseInfo' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/chat-settings:
    get:
      tags: [Admin]
      summary: Read chat settings
      description: Permission `settings.manage`. Idle timers, bubble colour, notification sound and warning text, plus the selectable sound options.
      operationId: adminChatSettings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChatSettings' }
    put:
      tags: [Admin]
      summary: Update chat settings
      description: Permission `settings.manage`. Warning thresholds must increase (1st < 2nd < auto-close); sound must be one of the offered options.
      operationId: updateChatSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSettings' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChatSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/inboxes:
    get:
      tags: [Admin]
      summary: List inboxes
      description: Permission `inboxes.manage`.
      operationId: adminListInboxes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inboxes with conversation counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminInbox' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create an inbox
      operationId: adminCreateInbox
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/InboxBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminInbox' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/inboxes/{id}:
    get:
      tags: [Admin]
      summary: Inbox detail
      operationId: adminShowInbox
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminInbox' }
    put:
      tags: [Admin]
      summary: Update an inbox
      operationId: adminUpdateInbox
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/InboxBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminInbox' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete an inbox
      description: Fails with 409 while conversations exist — deactivate instead.
      operationId: adminDeleteInbox
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/mitel/queues:
    get:
      tags: [Admin]
      summary: MiCC Open Media queue directory (for inbox configuration)
      description: Permission `inboxes.manage`. 503 when the Mitel integration is not configured; 502 on upstream errors.
      operationId: adminListMitelQueues
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: [string, 'null'] }
                        name: { type: [string, 'null'] }
        '502': { description: Upstream MiCC error }
        '503': { description: Mitel integration not configured }

  /api/v1/admin/teams:
    get:
      tags: [Admin]
      summary: List teams with members
      description: Permission `teams.manage`.
      operationId: adminListTeams
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminTeam' }
    post:
      tags: [Admin]
      summary: Create a team
      operationId: adminCreateTeam
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TeamBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminTeam' }

  /api/v1/admin/teams/{id}:
    put:
      tags: [Admin]
      summary: Update a team
      operationId: adminUpdateTeam
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/TeamBody' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete a team
      operationId: adminDeleteTeam
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '204': { description: Deleted }

  /api/v1/admin/teams/{id}/members:
    put:
      tags: [Admin]
      summary: Replace team membership
      operationId: adminSyncTeamMembers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_ids]
              properties:
                agent_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: Updated team with members }

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users (paginated)
      description: Permission `agents.manage`. Filters — `search` (name/email), `role` (role name).
      operationId: adminListUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  links: { type: object }
                  meta: { type: object }
    post:
      tags: [Admin]
      summary: Create a user (optionally with an agent profile)
      operationId: adminCreateUser
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/UserBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/users/{id}:
    put:
      tags: [Admin]
      summary: Update a user
      description: '`agent: null` removes the agent profile; omit `password` to keep it. Self-deactivation is rejected.'
      operationId: adminUpdateUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/UserBody' }
      responses:
        '200': { description: Updated user }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/roles:
    get:
      tags: [Admin]
      summary: List roles (picker source)
      operationId: adminListRoles
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Roles (id, name, description)' }

  /api/v1/admin/agents:
    get:
      tags: [Admin]
      summary: Agent directory (picker source for reroute/membership dialogs)
      operationId: adminListAgents
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Agents (id, display_name, user_name, status, team_ids)' }

  /api/v1/admin/faqs:
    get:
      tags: [Admin]
      summary: List FAQ translation groups
      description: Permission `faqs.manage`. `search` matches question/answer in any language.
      operationId: adminListFaqGroups
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FaqGroup' }
    post:
      tags: [Admin]
      summary: Create a FAQ group (one or both languages)
      operationId: adminCreateFaqGroup
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/FaqGroupBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FaqGroup' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/faqs/{translationGroup}:
    put:
      tags: [Admin]
      summary: Upsert/remove language versions of a group
      description: 'Per language: an object upserts, an explicit null removes. Removing the last version is rejected (422).'
      operationId: adminUpdateFaqGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: translationGroup, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { $ref: '#/components/requestBodies/FaqGroupBody' }
      responses:
        '200': { description: Updated group }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete a FAQ group (all languages)
      operationId: adminDeleteFaqGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: translationGroup, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/webhooks:
    get:
      tags: [Admin]
      summary: List webhooks (secret included; behind webhooks.manage)
      operationId: adminListWebhooks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Webhooks with delivery counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminWebhook' }
    post:
      tags: [Admin]
      summary: Register a webhook (secret auto-generated)
      operationId: adminCreateWebhook
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/WebhookBody' }
      responses:
        '201':
          description: Created (includes the signing secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminWebhook' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/webhooks/{id}:
    put:
      tags: [Admin]
      summary: Update a webhook
      operationId: adminUpdateWebhook
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/WebhookBody' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete a webhook (and its delivery log)
      operationId: adminDeleteWebhook
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '204': { description: Deleted }

  /api/v1/admin/webhooks/{id}/deliveries:
    get:
      tags: [Admin]
      summary: Delivery log for a webhook (debugging failed sends)
      operationId: adminListWebhookDeliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/NumericId' }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Paginated deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminWebhookDelivery' }
                  links: { type: object }
                  meta: { type: object }

  /api/v1/admin/inboxes/{id}/routing-rules:
    get:
      tags: [Admin]
      summary: Routing rules for an inbox (priority order)
      description: Permission `routing.manage`.
      operationId: adminListRoutingRules
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoutingRule' }
    post:
      tags: [Admin]
      summary: Create a routing rule (exactly one of team_id/agent_id)
      operationId: adminCreateRoutingRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/RoutingRuleBody' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/routing-rules/{id}:
    put:
      tags: [Admin]
      summary: Update a routing rule (switching target type clears the other)
      operationId: adminUpdateRoutingRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody: { $ref: '#/components/requestBodies/RoutingRuleBody' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete a routing rule
      operationId: adminDeleteRoutingRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '204': { description: Deleted }

  /api/v1/admin/analytics:
    get:
      tags: [Admin]
      summary: Dashboard analytics
      description: Permission `analytics.view`. Defaults to the last 14 days; the range may span at most 92 days.
      operationId: adminAnalytics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/broadcasting/auth:
    post:
      tags: [Auth]
      summary: Authorize a private websocket channel
      description: Standard Pusher-protocol channel authorization for `private-inbox.{id}` and `private-agents.{id}`.
      operationId: broadcastingAuth
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [channel_name, socket_id]
              properties:
                channel_name: { type: string, examples: ['private-inbox.1'] }
                socket_id: { type: string, examples: ['123.456'] }
      responses:
        '200':
          description: Channel signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

webhooks:
  conversation.started:
    post:
      summary: A visitor started a conversation
      description: |
        All webhook deliveries are `POST` JSON with headers `X-TDEChat-Event`,
        `X-TDEChat-Delivery` (delivery id) and `X-TDEChat-Signature`
        (`sha256=` + HMAC-SHA256 of the raw request body using the webhook secret).
        Non-2xx responses are retried 3 times (30s / 2m / 10m backoff); every attempt is
        logged in `webhook_deliveries`.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationWebhookPayload' }
      responses:
        '200': { description: Acknowledge with any 2xx }
  conversation.escalated:
    post:
      summary: A conversation was handed from the bot to human agents
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationWebhookPayload' }
      responses:
        '200': { description: Acknowledge with any 2xx }
  conversation.closed:
    post:
      summary: A conversation was closed
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConversationWebhookPayload'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        closed_by: { type: string, enum: [agent, visitor] }
      responses:
        '200': { description: Acknowledge with any 2xx }
  faq.missed:
    post:
      summary: The chatbot had no answer for a visitor query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, const: faq.missed }
                timestamp: { type: string, format: date-time }
                data:
                  type: object
                  properties:
                    query: { type: string }
                    language: { type: string }
                    conversation: { type: [string, 'null'], format: uuid }
                    inbox: { type: [string, 'null'] }
      responses:
        '200': { description: Acknowledge with any 2xx }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token from POST /api/v1/auth/login

  parameters:
    InboxSlug:
      name: inboxSlug
      in: path
      required: true
      description: Inbox slug (widget embed key)
      schema: { type: string }
    ConversationUuid:
      name: conversationUuid
      in: path
      required: true
      description: Public conversation identifier
      schema: { type: string, format: uuid }
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  requestBodies:
    MessageBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, maxLength: 4000 }
    InboxBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, slug, channel_type]
            properties:
              name: { type: string, maxLength: 255 }
              slug: { type: string, maxLength: 255, pattern: '^[A-Za-z0-9_-]+$' }
              channel_type: { type: string, enum: [standalone, mitel_openmedia] }
              channel_config:
                type: [object, 'null']
                properties:
                  mitel:
                    type: object
                    properties:
                      queue: { type: string }
                  bot:
                    type: object
                    properties:
                      escalate_on_miss: { type: boolean }
                  cms_url:
                    type: [string, 'null']
                    format: uri
                    maxLength: 2048
                    description: >-
                      Optional http(s) URL of an external CMS/ticketing system. When set,
                      the agent dashboard opens it in a new tab after an agent closes a
                      conversation in this inbox.
              bot_enabled: { type: boolean }
              is_active: { type: boolean }
    TeamBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 255 }
              description: { type: [string, 'null'], maxLength: 255 }
              is_active: { type: boolean }
    UserBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, role_id]
            properties:
              name: { type: string, maxLength: 255 }
              email: { type: string, format: email }
              password: { type: [string, 'null'], minLength: 8, description: Required on create; omit to keep on update }
              role_id: { type: integer }
              is_active: { type: boolean }
              agent:
                type: [object, 'null']
                description: Agent profile; null removes it on update
                properties:
                  display_name: { type: [string, 'null'] }
                  team_ids:
                    type: array
                    items: { type: integer }
    FaqGroupBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [translations]
            properties:
              translations:
                type: object
                description: 'Keys: ms / en. An object upserts that language; null removes it (update only).'
                properties:
                  ms: { $ref: '#/components/schemas/FaqTranslationInput' }
                  en: { $ref: '#/components/schemas/FaqTranslationInput' }
    WebhookBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url, events]
            properties:
              name: { type: string, maxLength: 255 }
              url: { type: string, format: uri, maxLength: 2048 }
              events:
                type: array
                minItems: 1
                items: { type: string, enum: [conversation.started, conversation.closed, conversation.escalated, faq.missed] }
              inbox_id: { type: [integer, 'null'], description: null fires for all inboxes }
              is_active: { type: boolean }
    RoutingRuleBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 255 }
              priority: { type: integer, minimum: 0, maximum: 1000 }
              conditions:
                type: [object, 'null']
                properties:
                  language: { type: string, enum: [ms, en] }
                  keywords:
                    type: array
                    items: { type: string }
              team_id: { type: integer, description: Exactly one of team_id/agent_id }
              agent_id: { type: integer, description: Exactly one of team_id/agent_id }
              is_active: { type: boolean }

  responses:
    NotFound:
      description: Resource not found (or inactive inbox)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conversation is not in a state that allows this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing permission, no agent profile, or not the assignee
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ConversationStatus:
      type: string
      enum: [pending, bot, awaiting_acceptance, active, closed, abandoned]

    AgentStatus:
      type: string
      enum: [available, busy, away, offline]

    Conversation:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        language: { type: string, enum: [ms, en] }
        visitor:
          type: object
          properties:
            name: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
        inbox:
          type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            name: { type: string }
            cms_url:
              type: [string, 'null']
              format: uri
              description: >-
                CMS/ticketing URL configured on the inbox. Only present on
                authenticated (agent) responses — never on the public widget API.
        assigned_agent:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                display_name: { type: string }
            - type: 'null'
        team:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
            - type: 'null'
        meta: { type: [object, 'null'] }
        last_activity_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        messages:
          type: array
          description: Present when the endpoint includes messages
          items: { $ref: '#/components/schemas/Message' }
        activity:
          type: array
          description: >
            Handling audit trail (accepted / transferred / rerouted / abandoned /
            closed). Agent endpoints only — never returned on the public API.
          items:
            type: object
            properties:
              type: { type: string, enum: [accepted, transferred, rerouted, abandoned, closed] }
              actor_type: { type: [string, 'null'], enum: [agent, visitor, system, null] }
              actor_name: { type: [string, 'null'] }
              detail:
                type: [object, 'null']
                description: "e.g. {from, to_agent, to_team, reason, was_with, by}"
              created_at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: integer }
        sender_type: { type: string, enum: [visitor, agent, bot, system] }
        agent:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                display_name: { type: string }
            - type: 'null'
        body: { type: string }
        meta:
          type: [object, 'null']
          description: 'e.g. `{"faq_id": 7}` on bot answers'
        created_at: { type: string, format: date-time }

    Faq:
      type: object
      properties:
        id: { type: integer }
        language: { type: string, enum: [ms, en] }
        question: { type: string }
        answer: { type: string }

    FaqTranslationInput:
      type: [object, 'null']
      properties:
        question: { type: string, maxLength: 500 }
        answer: { type: string, maxLength: 10000 }
        keywords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        is_active: { type: boolean }

    FaqGroup:
      type: object
      properties:
        translation_group: { type: string, format: uuid }
        translations:
          type: object
          properties:
            ms: { $ref: '#/components/schemas/FaqGroupTranslation' }
            en: { $ref: '#/components/schemas/FaqGroupTranslation' }
        usage_count: { type: integer }
        updated_at: { type: string, format: date-time }

    FaqGroupTranslation:
      type: [object, 'null']
      properties:
        id: { type: integer }
        question: { type: string }
        answer: { type: string }
        keywords:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        usage_count: { type: integer }

    AdminInbox:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        channel_type: { type: string, enum: [standalone, mitel_openmedia] }
        channel_config: { type: object }
        bot_enabled: { type: boolean }
        is_active: { type: boolean }
        conversations_count: { type: integer }
        created_at: { type: string, format: date-time }

    AdminTeam:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        agents:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              display_name: { type: string }
        created_at: { type: string, format: date-time }

    AdminUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role_id: { type: integer }
        role: { type: string }
        is_active: { type: boolean }
        agent:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                display_name: { type: [string, 'null'] }
                status: { $ref: '#/components/schemas/AgentStatus' }
                team_ids:
                  type: array
                  items: { type: integer }
            - type: 'null'
        created_at: { type: string, format: date-time }

    AdminWebhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        secret: { type: string, description: HMAC-SHA256 signing secret }
        events:
          type: array
          items: { type: string }
        inbox_id: { type: [integer, 'null'] }
        inbox:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
                slug: { type: string }
            - type: 'null'
        is_active: { type: boolean }
        deliveries_count: { type: integer }
        failed_deliveries_count: { type: integer }
        created_at: { type: string, format: date-time }

    AdminWebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        event: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        attempts: { type: integer }
        last_status_code: { type: [integer, 'null'] }
        last_error: { type: [string, 'null'] }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        payload: { type: object }
        created_at: { type: string, format: date-time }

    RoutingRule:
      type: object
      properties:
        id: { type: integer }
        inbox_id: { type: integer }
        name: { type: string }
        priority: { type: integer }
        conditions: { type: object }
        team:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
            - type: 'null'
        agent:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                display_name: { type: string }
            - type: 'null'
        is_active: { type: boolean }

    AnalyticsSummary:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        conversations_per_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        avg_handle_seconds: { type: [number, 'null'] }
        faq:
          type: object
          properties:
            queries: { type: integer }
            hits: { type: integer }
            hit_rate: { type: [number, 'null'], description: 0–1 }
        totals:
          type: object
          properties:
            conversations: { type: integer }
            closed: { type: integer }
            abandoned: { type: integer }
            active_now: { type: integer }
            awaiting_now: { type: integer }
        top_missed_queries:
          type: array
          items:
            type: object
            properties:
              query: { type: string }
              count: { type: integer }

    Agent:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        last_active_at: { type: [string, 'null'], format: date-time }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        role: { type: string, examples: [agent] }
        permissions:
          type: array
          items: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/Agent'
            - type: 'null'

    BilingualText:
      type: object
      description: A string in each supported language.
      properties:
        ms: { type: string }
        en: { type: string }

    ChatSettings:
      type: object
      properties:
        idle_enabled: { type: boolean }
        customer_warn1_minutes: { type: integer, example: 5 }
        customer_warn2_minutes: { type: integer, example: 8 }
        customer_close_minutes: { type: integer, example: 10 }
        agent_idle_minutes: { type: integer, example: 2 }
        bubble_color: { type: string, example: '#2f80ed' }
        notification_sound: { type: string, example: 'notification-1.mp3' }
        warn1_ms: { type: string }
        warn1_en: { type: string }
        warn2_ms: { type: string }
        warn2_en: { type: string }
        closed_ms: { type: string }
        closed_en: { type: string }
        faq_deflection_enabled:
          type: boolean
          description: Open the widget on the "Quick answers" FAQ screen before the pre-chat form.
        widget_faq_title_ms: { type: string, example: 'Jawapan Pantas' }
        widget_faq_title_en: { type: string, example: 'Quick answers' }
        widget_faq_prompt_ms: { type: string, example: 'Tidak menemui apa yang anda cari?' }
        widget_faq_prompt_en: { type: string, example: "Didn't find what you were looking for?" }
        widget_faq_button_ms: { type: string, example: 'Sembang dengan ejen' }
        widget_faq_button_en: { type: string, example: 'Chat with a live agent' }
        available_sounds:
          type: array
          items: { type: string }
          description: Read-only — the selectable notification sounds (GET only).
        warning_sound:
          type: string
          description: Read-only — the fixed customer-idle alert (GET only).

    LicenseInfo:
      type: object
      description: >-
        The synced license pool. Only `configured` is present when the platform env is unset.
      properties:
        configured: { type: boolean }
        valid:
          type: boolean
          description: At least one usable (active, unexpired) license exists locally.
        problem: { type: [string, 'null'] }
        platform_slug: { type: string }
        last_synced_at: { type: [string, 'null'], format: date-time }
        seats:
          type: object
          description: Agents licensed out of the usable pool.
          properties:
            used: { type: integer }
            max: { type: integer }
            free: { type: integer }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/LicenseRecord' }

    LicenseRecord:
      type: object
      properties:
        id: { type: integer, description: Local id — used by the release endpoint }
        masked_key: { type: string, example: '0SEA•••••••••••7COL' }
        status: { type: [string, 'null'], example: active }
        type: { type: [string, 'null'], example: premium }
        usable:
          type: boolean
          description: Active and unexpired, so it can hold an agent.
        expires_at: { type: [string, 'null'], format: date-time }
        days_remaining: { type: [integer, 'null'] }
        features:
          type: array
          items: { type: string }
        assigned_agent:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                display_name: { type: string }
            - type: 'null'
        assigned_at: { type: [string, 'null'], format: date-time }

    ConversationWebhookPayload:
      type: object
      properties:
        event: { type: string, enum: [conversation.started, conversation.escalated, conversation.closed] }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          properties:
            conversation: { $ref: '#/components/schemas/Conversation' }

    Error:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
